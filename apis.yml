apis:
  - aid: twirp:twirp-framework
    name: Twirp RPC Framework
    description: >-
      Twirp is a simple RPC framework with protobuf service definitions. Define
      your service in a .proto file and Twirp generates servers and clients
      implementing the Twirp wire protocol. Services are exposed over HTTP using
      POST requests with paths in the form /twirp/[Package].[Service]/[Method].
      Supports both Protobuf binary encoding (Content-Type: application/protobuf)
      and JSON encoding (Content-Type: application/json). Includes a Go runtime
      and protoc-gen-twirp code generator plugin.
