aid: twirp
name: Twirp
description: >-
  Twirp is a simple RPC framework built on Protocol Buffers, created by
  Twitch, that generates routing and serialization code from Protobuf
  service definitions for Go and other languages. Similar to gRPC but runs
  on the standard library's net/http Server without custom HTTP server or
  transport implementations. Supports both binary Protobuf and JSON serialization,
  making debugging easy. Uses HTTP POST for all requests with URLs in the format
  /twirp/[Package].[Service]/[Method]. Protocol version 7 is the current stable
  version. Licensed under Apache 2.0.
